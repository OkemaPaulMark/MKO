<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E7D32" />

    <!-- Primary SEO (overridden per-page via React Helmet Async) -->
    <title>MKO — Targeted Women's Organization</title>
    <meta
      name="description"
      content="MKO (Targeted Women's Organization) empowers women, girls, youth, and immigrant families in Sweden through community programs, mentorship, and leadership development."
    />
    <link rel="canonical" href="https://www.mko.se/" />

    <!-- Fonts: Poppins (headings) + Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MKO — Targeted Women's Organization" />
    <meta property="og:title" content="MKO — Targeted Women's Organization" />
    <meta
      property="og:description"
      content="Empowering women, inspiring youth, and building stronger communities across Sweden."
    />
    <meta property="og:url" content="https://www.mko.se/" />
    <!-- TODO(backend): replace with final 1200x630 organization image -->
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MKO — Targeted Women's Organization" />
    <meta
      name="twitter:description"
      content="Empowering women, inspiring youth, and building stronger communities across Sweden."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Structured Data: Schema.org Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Targeted Women's Organization (MKO)",
        "alternateName": "MKO",
        "url": "https://www.mko.se/",
        "logo": "https://www.mko.se/favicon.svg",
        "description": "A Swedish non-profit organization empowering women, girls, youth, and immigrant families through community programs, mentorship, and leadership development.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kristinehamn",
          "addressRegion": "Värmland County",
          "addressCountry": "SE"
        },
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
